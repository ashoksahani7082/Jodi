<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fa" />
  <meta name="description" content="Jodi — download the Android app." />
  <title>Jodi | Official App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f8fa; --surface: rgba(255,255,255,.94); --line: rgba(220,38,65,.18);
      --accent: #c91f3d; --accent2: #e34a62; --text: #252a33; --muted: #667085;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body { margin: 0; min-height: 100vh; overflow-x: hidden; display: grid; place-items: center;
      padding: 28px 18px; color: var(--text); font-family: Inter, system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% 8%, rgba(225,29,62,.07), transparent 38%),
                  radial-gradient(ellipse at 10% 85%, rgba(190,25,55,.045), transparent 34%),
                  linear-gradient(145deg, #f9fafb 0%, #f0f2f5 52%, #f7f8fa 100%); }
    .ambient { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(1px); opacity: .5; animation: float 12s ease-in-out infinite; }
    .orb.one { width: 230px; height: 230px; background: rgba(225,29,62,.08); top: 8%; left: -90px; }
    .orb.two { width: 300px; height: 300px; background: rgba(225,29,62,.055); bottom: -110px; right: -90px; animation-delay: -5s; }
    .orb.three { width: 90px; height: 90px; background: rgba(225,29,62,.07); top: 18%; right: 13%; animation-delay: -8s; }
    @keyframes float { 0%,100% { transform: translate3d(0,0,0) } 50% { transform: translate3d(18px,-24px,0) } }
    .wrap { width: min(100%, 460px); position: relative; z-index: 1; }
    .topline { display:flex; align-items:center; justify-content:center; gap:9px; margin-bottom:20px; color:#667085; font-size:12px; letter-spacing:2.4px; text-transform:uppercase; font-weight:700; }
    .topline:before,.topline:after { content:""; height:1px; width:34px; background:linear-gradient(90deg, transparent, var(--accent)); }
    .topline:after { transform:scaleX(-1); }
    .card { position:relative; text-align:center; padding:36px 28px 30px; border-radius:28px;
      background:linear-gradient(135deg, rgba(255,255,255,.92), rgba(250,250,252,.96));
      border:1px solid rgba(220,38,65,.18);
      box-shadow:0 28px 90px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,90,120,.12);
      backdrop-filter:blur(28px) saturate(165%); -webkit-backdrop-filter:blur(28px) saturate(165%);
      overflow:hidden; }
    .card:before { content:""; position:absolute; inset:-1px; border-radius:28px; padding:1px;
      background:linear-gradient(135deg, rgba(220,38,65,.28), rgba(220,38,65,.035) 32%, transparent 58%, rgba(220,38,65,.16));
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
    .card:after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
      background:linear-gradient(125deg, rgba(255,255,255,.13), transparent 24%, transparent 70%, rgba(255,90,120,.07));
      opacity:.9; }
    .logo-ring { width:156px; height:156px; margin:0 auto 25px; padding:5px; border-radius:50%;
      background:linear-gradient(145deg,#c91f3d,#e34a62 45%,#8d1730);
      box-shadow:0 0 0 4px rgba(225,29,62,.06), 0 0 28px rgba(225,29,62,.22); }
    .logo-inner { width:100%; height:100%; display:grid; place-items:center; border-radius:50%;
      background:linear-gradient(145deg,#fff,#ffffff); overflow:hidden; border:2px solid rgba(220,38,65,.18); }
    .logo-inner span { color:#bd1e3c; font-size:66px; line-height:1; font-weight:900; letter-spacing:-4px; text-shadow:3px 3px 0 rgba(255,212,0,.55); }
    h1 { margin:0; font-size:clamp(29px,7vw,36px); line-height:1.15; letter-spacing:-1.2px; font-weight:800; }
    h1 span { color:var(--accent2); }
    .subtitle { color:var(--muted); font-size:14px; line-height:1.7; margin:13px auto 22px; max-width:320px; }
    .status { display:inline-flex; align-items:center; gap:8px; padding:8px 13px; margin-bottom:25px;
      border:1px solid rgba(220,38,65,.14); border-radius:30px; color:#9f263d; background:rgba(225,29,62,.06);
      font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; }
    .dot { width:7px; height:7px; border-radius:50%; background:#e34a62; box-shadow:0 0 10px #e34a62; }
    .download { display:flex; justify-content:center; align-items:center; gap:11px; width:100%; min-height:58px; padding:15px 20px; border-radius:15px;
      color:#ffffff; text-decoration:none; font-size:15px; font-weight:800; letter-spacing:.2px;
      background:linear-gradient(100deg,#c91f3d,#e34a62); box-shadow:0 9px 28px rgba(190,25,55,.16), inset 0 1px rgba(255,255,255,.65);
      transition:transform .2s ease, box-shadow .2s ease; }
    .download:hover { transform:translateY(-3px); box-shadow:0 14px 34px rgba(190,25,55,.22); }
    .download:active { transform:translateY(0); } .download svg { width:20px; height:20px; }
    .file-note { margin:12px 0 0; color:#7b8493; font-size:11px; }
    .divider { height:1px; margin:27px 0 22px; background:linear-gradient(90deg,transparent,rgba(220,38,65,.14),transparent); }
    .steps-title { margin:0 0 15px; color:#252a33; font-size:13px; font-weight:700; }
    .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .step { padding:13px 7px; border:1px solid rgba(220,38,65,.13); border-radius:13px;
      background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(245,246,248,.98));
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:inset 0 1px rgba(220,38,65,.035); }
    .step b { display:grid; place-items:center; width:25px; height:25px; margin:0 auto 8px; border-radius:50%; color:#ffffff; background:var(--accent2); font-size:11px; }
    .step span { display:block; color:#596273; font-size:10px; line-height:1.45; }
    footer { text-align:center; margin-top:18px; color:#7b8493; font-size:11px; letter-spacing:.2px; }
    @media(max-width:380px) { .card { padding:30px 19px 24px; } .steps { gap:6px; } .step { padding:11px 4px; } }
    @media(prefers-reduced-motion:reduce) { *,*:before,*:after { animation:none!important; transition:none!important; } }
  </style>

<body>
  <div class="ambient" aria-hidden="true"><i class="orb one"></i><i class="orb two"></i><i class="orb three"></i></div>
  <main class="wrap">
    <div class="topline">Welcome to</div>
    <section class="card">
      <div class="logo-ring"><div class="logo-inner"><span>J</span></div></div>
      <h1>Jodi</h1>
      <p class="subtitle">Your app is ready. Download the Android application using the button below.</p>
      <div class="status"><i class="dot"></i> Android app available</div>
      <a class="download" href="./jodi777.apk" download="jodi777.apk">

      <div class="divider"></div>
      <p class="steps-title">How to install</p>
      <div class="steps">
        <div class="step"><b>1</b><span>Tap Download APK</span></div>
        <div class="step"><b>2</b><span>Open the downloaded file</span></div>
        <div class="step"><b>3</b><span>Follow install prompt</span></div>
      </div>
    </section>
    <footer>© <span id="year"></span> Jodi. All rights reserved.</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
